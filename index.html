<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Neon Snake</title>
  <style>
    :root {
      color-scheme: dark;
      --page: #080b12;
      --panel: rgba(15, 21, 32, .82);
      --canvas: #0b111b;
      --line: rgba(138, 161, 190, .09);
      --text: #eff5ff;
      --muted: #8391a7;
      --border: rgba(160, 181, 214, .16);
      --accent: #9dff62;
      --accent-2: #35e5ff;
      --danger: #ff5d86;
      --shadow: 0 24px 80px rgba(0, 0, 0, .42);
    }

    @media (prefers-color-scheme: light) {
      :root {
        --page: #eef2f7;
        --panel: rgba(255, 255, 255, .84);
        --canvas: #f5f8fc;
        --line: rgba(65, 84, 112, .1);
        --text: #142033;
        --muted: #66758b;
        --border: rgba(50, 70, 100, .16);
        --shadow: 0 24px 70px rgba(42, 58, 87, .16);
      }
    }

    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background: var(--page);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      letter-spacing: .01em;
    }

    .app { width: min(100%, 720px); }
    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 18px; }
    .eyebrow { margin: 0 0 7px; color: var(--accent-2); font-size: 11px; font-weight: 800; letter-spacing: .2em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(2rem, 6vw, 3.1rem); line-height: .98; letter-spacing: -.055em; }
    .tagline { margin: 10px 0 0; color: var(--muted); font-size: 14px; }
    .stats { display: flex; gap: 10px; }
    .stat { min-width: 92px; padding: 11px 14px; border: 1px solid var(--border); border-radius: 13px; background: var(--panel); text-align: right; box-shadow: var(--shadow); }
    .stat-label { display: block; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    .stat-value { display: block; margin-top: 3px; font-size: 21px; font-weight: 800; }

    .game-shell { position: relative; overflow: hidden; padding: 12px; border: 1px solid var(--border); border-radius: 20px; background: var(--panel); box-shadow: var(--shadow); }
    canvas { display: block; width: 100%; aspect-ratio: 1; border-radius: 12px; background: var(--canvas); touch-action: none; }
    .overlay { position: absolute; inset: 12px; display: grid; place-items: center; border-radius: 12px; background: rgba(7, 11, 18, .74); opacity: 0; pointer-events: none; transition: opacity .22s ease; backdrop-filter: blur(7px); }
    .overlay.visible { opacity: 1; pointer-events: auto; }
    .result { width: min(88%, 320px); padding: 26px; border: 1px solid var(--border); border-radius: 18px; background: var(--panel); text-align: center; box-shadow: var(--shadow); }
    .result-kicker { margin: 0 0 7px; color: var(--danger); font-size: 11px; font-weight: 800; letter-spacing: .18em; text-transform: uppercase; }
    h2 { margin: 0; font-size: 28px; letter-spacing: -.04em; }
    .final-score { margin: 12px 0 20px; color: var(--muted); }
    .final-score strong { color: var(--text); font-size: 25px; }
    button { border: 0; border-radius: 10px; padding: 12px 19px; color: #07100b; background: var(--accent); font: inherit; font-weight: 800; cursor: pointer; box-shadow: 0 0 24px rgba(157, 255, 98, .2); }
    button:hover { filter: brightness(1.08); transform: translateY(-1px); }
    button:focus-visible { outline: 3px solid var(--accent-2); outline-offset: 3px; }
    footer { display: flex; justify-content: space-between; gap: 12px; margin: 15px 2px 0; color: var(--muted); font-size: 12px; }
    kbd { padding: 2px 6px; border: 1px solid var(--border); border-radius: 5px; color: var(--text); background: var(--panel); font-family: inherit; font-size: 11px; }
    @media (max-width: 560px) { header { align-items: flex-start; flex-direction: column; } .stats { width: 100%; } .stat { flex: 1; text-align: left; } footer { flex-direction: column; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div>
        <p class="eyebrow">Arcade / 001</p>
        <h1>Neon Snake</h1>
        <p class="tagline">Grow your streak. Own the grid.</p>
      </div>
      <div class="stats" aria-label="Game statistics">
        <div class="stat"><span class="stat-label">Score</span><span class="stat-value" id="score">0</span></div>
        <div class="stat"><span class="stat-label">Best</span><span class="stat-value" id="best">0</span></div>
      </div>
    </header>

    <section class="game-shell" aria-label="Snake game">
      <canvas id="game" width="600" height="600" aria-label="Snake game board"></canvas>
      <div class="overlay" id="overlay">
        <div class="result">
          <p class="result-kicker">Run complete</p>
          <h2>Nice try.</h2>
          <p class="final-score">You scored <strong id="final-score">0</strong></p>
          <button id="restart" type="button">Play again</button>
        </div>
      </div>
    </section>
    <footer><span><kbd>↑</kbd> <kbd>↓</kbd> <kbd>←</kbd> <kbd>→</kbd> to move</span><span>Eat the pink. Avoid yourself.</span></footer>
  </main>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    const scoreEl = document.getElementById("score");
    const bestEl = document.getElementById("best");
    const overlay = document.getElementById("overlay");
    const finalScore = document.getElementById("final-score");
    const restartButton = document.getElementById("restart");
    const gridSize = 24;
    const cell = canvas.width / gridSize;
    let snake, food, direction, nextDirection, score, best, loop, lastStep, stepMs, gameOver;

    best = Number(localStorage.getItem("neon-snake-best") || 0);
    bestEl.textContent = best;

    function reset() {
      snake = [{ x: 12, y: 12 }, { x: 11, y: 12 }, { x: 10, y: 12 }];
      direction = { x: 1, y: 0 };
      nextDirection = { x: 1, y: 0 };
      score = 0;
      stepMs = 145;
      gameOver = false;
      scoreEl.textContent = score;
      overlay.classList.remove("visible");
      placeFood();
      lastStep = performance.now();
      cancelAnimationFrame(loop);
      loop = requestAnimationFrame(tick);
    }

    function placeFood() {
      do {
        food = { x: Math.floor(Math.random() * gridSize), y: Math.floor(Math.random() * gridSize) };
      } while (snake.some(segment => segment.x === food.x && segment.y === food.y));
    }

    function tick(now) {
      if (now - lastStep >= stepMs) {
        lastStep = now;
        update();
      }
      draw();
      if (!gameOver) loop = requestAnimationFrame(tick);
    }

    function update() {
      direction = nextDirection;
      const head = { x: snake[0].x + direction.x, y: snake[0].y + direction.y };
      const hitWall = head.x < 0 || head.x >= gridSize || head.y < 0 || head.y >= gridSize;
      const hitSelf = snake.some(segment => segment.x === head.x && segment.y === head.y);
      if (hitWall || hitSelf) return endGame();
      snake.unshift(head);
      if (head.x === food.x && head.y === food.y) {
        score++;
        stepMs = Math.max(62, 145 - score * 4);
        scoreEl.textContent = score;
        if (score > best) {
          best = score;
          bestEl.textContent = best;
          localStorage.setItem("neon-snake-best", best);
        }
        placeFood();
      } else {
        snake.pop();
      }
    }

    function endGame() {
      gameOver = true;
      finalScore.textContent = score;
      overlay.classList.add("visible");
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--line");
      ctx.lineWidth = 1;
      for (let i = 0; i <= gridSize; i++) {
        ctx.beginPath(); ctx.moveTo(i * cell, 0); ctx.lineTo(i * cell, canvas.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * cell); ctx.lineTo(canvas.width, i * cell); ctx.stroke();
      }
      const pulse = 0.9 + Math.sin(performance.now() / 180) * .08;
      ctx.shadowColor = "#ff5d86"; ctx.shadowBlur = 18;
      ctx.fillStyle = "#ff5d86";
      ctx.beginPath(); ctx.arc((food.x + .5) * cell, (food.y + .5) * cell, cell * .29 * pulse, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      snake.forEach((segment, index) => {
        const inset = index === 0 ? 2 : 3;
        ctx.fillStyle = index === 0 ? "#c6ff75" : "#56e99b";
        ctx.shadowColor = index === 0 ? "#9dff62" : "#35e5ff";
        ctx.shadowBlur = index === 0 ? 15 : 9;
        roundRect(ctx, segment.x * cell + inset, segment.y * cell + inset, cell - inset * 2, cell - inset * 2, 6);
        ctx.fill();
      });
      ctx.shadowBlur = 0;
    }

    function roundRect(context, x, y, width, height, radius) {
      context.beginPath();
      context.roundRect(x, y, width, height, radius);
    }

    function setDirection(x, y) {
      if (x + direction.x !== 0 || y + direction.y !== 0) nextDirection = { x, y };
    }

    const keys = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0], w: [0, -1], s: [0, 1], a: [-1, 0], d: [1, 0] };
    addEventListener("keydown", event => {
      if (keys[event.key]) { event.preventDefault(); setDirection(...keys[event.key]); }
      if (event.key === " " && gameOver) reset();
    });
    let touchStart;
    canvas.addEventListener("touchstart", event => { touchStart = event.touches[0]; }, { passive: true });
    canvas.addEventListener("touchend", event => {
      if (!touchStart) return;
      const touch = event.changedTouches[0];
      const dx = touch.clientX - touchStart.clientX, dy = touch.clientY - touchStart.clientY;
      if (Math.max(Math.abs(dx), Math.abs(dy)) > 20) setDirection(Math.abs(dx) > Math.abs(dy) ? Math.sign(dx) : 0, Math.abs(dy) >= Math.abs(dx) ? Math.sign(dy) : 0);
      touchStart = null;
    }, { passive: true });
    restartButton.addEventListener("click", reset);
    reset();
  </script>
</body>
</html>
